<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Order - Electric Oracle Spirituals</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-dark: #1a1a2e;
            --primary-purple: #6d44c5;
            --accent-gold: #d4af37;
            --text-light: #f8f9fa;
            --text-dark: #2d3047;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 2rem 0;
            background: linear-gradient(135deg, var(--primary-dark), #2d2d5a);
            color: var(--text-light);
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header .icon {
            font-size: 3rem;
            color: var(--accent-gold);
            margin-bottom: 1rem;
        }

        .tracking-form {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-purple);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: var(--accent-gold);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .tracking-result {
            display: none;
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .tracking-result.show {
            display: block;
        }

        .error-message {
            display: none;
            background: #ffe6e6;
            color: #cc0000;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            border-left: 4px solid #cc0000;
        }

        .error-message.show {
            display: block;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            background: linear-gradient(135deg, var(--primary-purple), #8866dd);
            color: white;
            border-radius: 10px;
            margin-bottom: 2rem;
        }

        .status-badge {
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .info-card {
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid var(--primary-purple);
        }

        .info-card h3 {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .info-card p {
            font-size: 1rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        .timeline {
            position: relative;
            padding: 2rem 0;
        }

        .timeline h2 {
            margin-bottom: 2rem;
            color: var(--text-dark);
        }

        .timeline-item {
            position: relative;
            padding-left: 50px;
            margin-bottom: 2rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 15px;
            top: 30px;
            height: calc(100% + 2rem);
            width: 2px;
            background: #ddd;
        }

        .timeline-item:last-child::before {
            display: none;
        }

        .timeline-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--primary-purple);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            z-index: 1;
        }

        .timeline-content {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 10px;
        }

        .timeline-time {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .timeline-location {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .timeline-status {
            color: var(--primary-purple);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .timeline-notes {
            color: #666;
            font-size: 0.9rem;
        }

        .qr-section {
            text-align: center;
            margin-top: 2rem;
            padding: 2rem;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .qr-section img {
            max-width: 200px;
            border: 3px solid var(--primary-purple);
            border-radius: 10px;
            padding: 10px;
            background: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .status-header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">📦</div>
            <h1>Track Your Order</h1>
            <p>Enter your waybill number to track your shipment</p>
        </div>

        <div class="tracking-form">
            <form id="trackingForm">
                <div class="form-group">
                    <label for="waybillNumber">Waybill Number</label>
                    <input 
                        type="text" 
                        id="waybillNumber" 
                        placeholder="e.g., WB-2025-1735567890123-456"
                        required
                    >
                </div>
                <button type="submit" class="btn" id="trackBtn">
                    <i class="fas fa-search"></i> Track Shipment
                </button>
            </form>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="tracking-result" id="trackingResult">
            <div class="status-header">
                <div>
                    <h2 id="waybillNumberDisplay"></h2>
                    <p id="productName"></p>
                </div>
                <div class="status-badge" id="statusBadge"></div>
            </div>

            <div class="info-grid">
                <div class="info-card">
                    <h3>Customer</h3>
                    <p id="customerName"></p>
                </div>
                <div class="info-card">
                    <h3>Delivery Address</h3>
                    <p id="deliveryAddress"></p>
                </div>
                <div class="info-card">
                    <h3>Courier</h3>
                    <p id="courier"></p>
                </div>
                <div class="info-card">
                    <h3>Estimated Delivery</h3>
                    <p id="estimatedDelivery"></p>
                </div>
            </div>

            <div class="timeline">
                <h2>Shipment Timeline</h2>
                <div id="timelineContainer"></div>
            </div>

            <div class="qr-section" id="qrSection" style="display: none;">
                <h3>QR Code</h3>
                <p style="margin: 1rem 0; color: #666;">Scan to track this shipment</p>
                <img id="qrCodeImage" src="" alt="Waybill QR Code">
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // Firebase configuration (use same config as main site)
        const firebaseConfig = {
            apiKey: "AIzaSyDKh2BEQwn9zPJ_hzCh_U2IQw8WZMO2Mls",
            authDomain: "electric-oracle-spiritual.firebaseapp.com",
            projectId: "electric-oracle-spiritual",
            storageBucket: "electric-oracle-spiritual.firebasestorage.app",
            messagingSenderId: "542817005556",
            appId: "1:542817005556:web:c93dc1b62f58ce8f53f976"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Get waybill from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const waybillParam = urlParams.get('waybill');

        if (waybillParam) {
            document.getElementById('waybillNumber').value = waybillParam;
            // Auto-track if waybill is in URL
            setTimeout(() => {
                trackShipment(waybillParam);
            }, 500);
        }

        // Form submission
        document.getElementById('trackingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const waybillNumber = document.getElementById('waybillNumber').value.trim();
            await trackShipment(waybillNumber);
        });

        async function trackShipment(waybillNumber) {
            const trackBtn = document.getElementById('trackBtn');
            const errorMessage = document.getElementById('errorMessage');
            const trackingResult = document.getElementById('trackingResult');

            // Reset UI
            errorMessage.classList.remove('show');
            trackingResult.classList.remove('show');
            trackBtn.disabled = true;
            trackBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Tracking...';

            try {
                const waybillRef = db.collection('waybills').doc(waybillNumber);
                const waybillDoc = await waybillRef.get();

                if (!waybillDoc.exists) {
                    throw new Error('Waybill not found. Please check the number and try again.');
                }

                const data = waybillDoc.data();
                displayTrackingResult(data);

            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.classList.add('show');
            } finally {
                trackBtn.disabled = false;
                trackBtn.innerHTML = '<i class="fas fa-search"></i> Track Shipment';
            }
        }

        function displayTrackingResult(data) {
            const trackingResult = document.getElementById('trackingResult');

            // Header info
            document.getElementById('waybillNumberDisplay').textContent = data.waybillNumber;
            document.getElementById('productName').textContent = data.productInfo.name;

            // Status badge
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = formatStatus(data.status);
            statusBadge.style.backgroundColor = getStatusColor(data.status);

            // Info cards
            document.getElementById('customerName').textContent = data.customerInfo.name;
            document.getElementById('deliveryAddress').textContent = 
                `${data.customerInfo.deliveryAddress.city}, ${data.customerInfo.deliveryAddress.state}`;
            document.getElementById('courier').textContent = data.logisticsInfo.courier;
            document.getElementById('estimatedDelivery').textContent = 
                data.logisticsInfo.estimatedDelivery || 'TBD';

            // Timeline
            const timelineContainer = document.getElementById('timelineContainer');
            timelineContainer.innerHTML = '';

            // Reverse checkpoints to show latest first
            const checkpoints = [...data.checkpoints].reverse();

            checkpoints.forEach((checkpoint, index) => {
                const timelineItem = document.createElement('div');
                timelineItem.className = 'timeline-item';

                const icon = getStatusIcon(checkpoint.status);
                const date = new Date(checkpoint.timestamp);

                timelineItem.innerHTML = `
                    <div class="timeline-icon">
                        <i class="${icon}"></i>
                    </div>
                    <div class="timeline-content">
                        <div class="timeline-time">${date.toLocaleString()}</div>
                        <div class="timeline-location"><i class="fas fa-map-marker-alt"></i> ${checkpoint.location}</div>
                        <div class="timeline-status">${formatStatus(checkpoint.status)}</div>
                        <div class="timeline-notes">${checkpoint.notes}</div>
                        ${checkpoint.handler ? `<div class="timeline-notes" style="margin-top: 0.5rem;">Handler: ${checkpoint.handler}</div>` : ''}
                    </div>
                `;

                timelineContainer.appendChild(timelineItem);
            });

            // QR Code
            if (data.qrCodeUrl) {
                document.getElementById('qrCodeImage').src = data.qrCodeUrl;
                document.getElementById('qrSection').style.display = 'block';
            }

            trackingResult.classList.add('show');
        }

        function formatStatus(status) {
            const statusMap = {
                'pending': 'Pending Dispatch',
                'dispatched': 'Dispatched',
                'in_transit': 'In Transit',
                'out_for_delivery': 'Out for Delivery',
                'delivered': 'Delivered',
                'failed': 'Delivery Failed'
            };
            return statusMap[status] || status;
        }

        function getStatusColor(status) {
            const colorMap = {
                'pending': '#FFA500',
                'dispatched': '#4169E1',
                'in_transit': '#1E90FF',
                'out_for_delivery': '#32CD32',
                'delivered': '#228B22',
                'failed': '#DC143C'
            };
            return colorMap[status] || '#666';
        }

        function getStatusIcon(status) {
            const iconMap = {
                'pending': 'fas fa-clock',
                'dispatched': 'fas fa-box',
                'in_transit': 'fas fa-truck',
                'out_for_delivery': 'fas fa-shipping-fast',
                'delivered': 'fas fa-check-circle',
                'failed': 'fas fa-exclamation-triangle'
            };
            return iconMap[status] || 'fas fa-circle';
        }
    </script>
</body>
</html>
